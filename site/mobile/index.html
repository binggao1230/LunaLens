<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="Explore lunar landing sites with the LunaLens guided mission.">
  <base href="../">
  <title>LunaLens · Education mission</title>
  <link rel="icon" href="assets/lunalens-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/mission.css">
  <link rel="stylesheet" href="css/edu.css">
  <link rel="stylesheet" href="/mobile/mobile.css">
</head>
<body class="mobile-app" data-view="start">
  <header class="mobile-topbar">
    <a class="brand" href="#/start/education" aria-label="LunaLens · Education"><img src="assets/lunalens-logo.svg" alt=""><span>LunaLens</span></a>
    <button class="mobile-back" id="mobile-back" type="button" aria-label="Return to probe choice">‹</button>
    <span class="mobile-mode" id="mode-label">Education</span>
    <label class="language-picker"><span class="sr-only">Language</span><select id="language" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option><option value="zh">中文</option></select></label>
  </header>

  <div id="page-scroll">
    <main>
      <section class="view" id="v-start"></section>
      <section class="view" id="v-mission"></section>
    </main>
  </div>
  <div id="edu"></div>
  <div id="flight"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/mobile/mobile.js"></script>
</body>
</html>
