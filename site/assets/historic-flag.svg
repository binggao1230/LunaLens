<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 545" width="500" height="545" role="img" aria-label="Muted blue triangular lunar history marker flag with North Star emblem">
  <title>LunaLens — Historic landing site flag</title>
  <desc>A soft, matte blue triangular flag with a pale star emblem attached to a muted blue-gray pole with a rounded base. Transparent background.</desc>

  <!-- Flat, washed-out blue fabric, with the subtly curved silhouette of the second flag -->
  <path d="M139 109 C207 132 329 175 412 198 C430 203 432 222 414 231 C343 259 219 303 139 325 Z" fill="#73A8CB"/>
  <!-- Soft folded fabric detail; deliberately matte rather than glossy -->
  <path d="M139 275 C180 246 208 233 247 235 C303 236 358 250 415 231 C332 265 225 304 139 325 Z" fill="#548BB1" opacity=".8"/>
  <path d="M139 109 C222 139 342 181 413 200 C357 188 272 161 200 141 C168 132 149 120 139 119 Z" fill="#A9CCDF" opacity=".2"/>

  <!-- North Star emblem: elongated four-point compass sparkle, matte ivory -->
  <path d="M250 165 C256 198 261 207 295 219 C263 225 255 233 250 267 C245 234 236 225 204 219 C237 211 246 200 250 165 Z" fill="#F4F4EB"/>
  <!-- Two tiny supporting space sparkles -->
  <path d="M325 188 Q327 200 339 202 Q327 205 325 217 Q323 205 311 202 Q323 199 325 188 Z" fill="#F4F4EB" opacity=".94"/>
  <path d="M194 256 Q196 264 204 266 Q196 268 194 276 Q192 268 184 266 Q192 264 194 256 Z" fill="#F4F4EB" opacity=".9"/>

  <!-- Pole and the flat disc that anchors the marker to the map -->
  <ellipse cx="119" cy="476" rx="84" ry="41" fill="#839AA4"/>
  <path d="M36 474 C39 453 73 437 119 437 C165 437 196 453 203 474 C183 493 56 493 36 474 Z" fill="#A6BAC2"/>
  <ellipse cx="119" cy="465" rx="69" ry="28" fill="#B6C7CE" opacity=".42"/>
  <rect x="103" y="96" width="33" height="368" rx="14" fill="#98AFB7"/>
  <path d="M104 116 C104 102 110 98 114 98 L117 98 L117 454 C115 461 107 463 104 457 Z" fill="#B3C4CA" opacity=".46"/>
  <circle cx="120" cy="81" r="36" fill="#9FB4BC"/>
  <path d="M91 61 C103 47 120 44 133 50 C115 49 100 58 94 74 Z" fill="#B5C7CD" opacity=".36"/>
</svg>
