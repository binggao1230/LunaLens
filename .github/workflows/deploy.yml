# Deploy the static site to Cloudflare Workers on every push to main.
# See archive/doc/PLAN.md §2.5. site/ carries the code; its data/ folder is 34 MB and stays out of git,
# so the release holding it is downloaded and unpacked here before Wrangler runs.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the site data from the snapshot release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/snapshot
          gh release download lunalens-snapshot-2026-11-14 --repo "$GITHUB_REPOSITORY" \
            --pattern 'lunalens.zip.part*' --pattern 'restore-lunalens.py' --pattern 'lunalens-files.json' \
            --dir /tmp/snapshot
          python3 /tmp/snapshot/restore-lunalens.py
          mkdir -p site/data
          cp -a /tmp/snapshot/lunalens/site/data/. site/data/
          du -sh site/data
      - name: Set up Node for the Atlas build
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/atlas/source/web/package-lock.json
      - name: Build Atlas from source
        run: site/tools/build_atlas.sh
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.158.0
          command: deploy

      - name: Preflight the deployed site
        run: |
          # Workers deployments can take a few seconds to replace the cached edge copy.
          sleep 12
          node site/tools/preflight.mjs
