[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunalens"
version = "0.1.0"
description = "Luna Lens backend: terrain-aware sunlight and Earth-link windows for lunar landing sites"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["lunalens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
